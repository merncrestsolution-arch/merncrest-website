# Fallback origin config when TLS certs are not yet issued.
# Cloudflare can proxy HTTPS → this server on :80 (Flexible SSL).

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream merncrest_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    location /_next/static/ {
        proxy_pass http://merncrest_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # MernCrest Connect APK — direct file (avoids proxy/HTML corruption on mobile).
    location = /downloads/merncrest-connect.apk {
        alias /var/www/downloads/merncrest-connect.apk;
        default_type application/vnd.android.package-archive;
        gzip off;
        add_header Content-Disposition 'attachment; filename="merncrest-connect.apk"';
        add_header Cache-Control "no-store";
    }

    location = /downloads/connect-icon.png {
        alias /var/www/downloads/connect-icon.png;
        default_type image/png;
        gzip off;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://merncrest_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $forwarded_proto $http_x_forwarded_proto;
        if ($forwarded_proto = "") {
            set $forwarded_proto $scheme;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
