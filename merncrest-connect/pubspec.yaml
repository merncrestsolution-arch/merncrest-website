name: merncrest_connect
description: MernCrest Connect — staff mobile app for system.merncrest.lk
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  local_auth: ^2.3.0
  geolocator: ^14.0.2
  mobile_scanner: ^7.4.0
  camera: ^0.12.0+2
  permission_handler: ^13.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1a0f2e"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
