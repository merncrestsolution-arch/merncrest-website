# Production stack for a single AWS Lightsail (Ubuntu) instance.
# Direct TLS: Let's Encrypt on :443 (run deploy/ssl-init.sh).
# Or Cloudflare proxy: HTTPS at edge → origin :80 (use default-http-only.conf).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: merncrest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merncrest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-merncrest}
    volumes:
      - merncrest_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merncrest} -d ${POSTGRES_DB:-merncrest}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [merncrest]

  redis:
    image: redis:7-alpine
    container_name: merncrest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - merncrest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [merncrest]

  # One-off: syncs the Prisma schema and seeds. Exits when done.
  migrator:
    build:
      context: .
      target: migrator
    image: merncrest-migrator:latest
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [merncrest]

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://merncrest.lk}
    image: merncrest-app:latest
    container_name: merncrest-app
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks: [merncrest]

  nginx:
    image: nginx:1.27-alpine
    container_name: merncrest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # active.conf is copied by deploy/ssl-init.sh; defaults to HTTP-only until certs exist.
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks: [merncrest]

volumes:
  merncrest_pg_data:
  merncrest_redis_data:

networks:
  merncrest:
    driver: bridge
